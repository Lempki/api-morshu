[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-api-morshu"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "g2p-en>=2.1.0",
    "nltk>=3.8",
    "numpy>=1.26",
    "pydub>=0.25",
    # Python 3.13 removed audioop, which pydub imports. This package restores it.
    "audioop-lts; python_version >= '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tts_api"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# These libraries ship without type hints or stubs.
[[tool.mypy.overrides]]
module = ["g2p_en.*", "nltk.*", "pydub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.dev-standards.template]
package = "tts_api"
