extend = ".ruff-base.toml"

[lint.isort]
known-first-party = ["tts_api"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[lint.extend-per-file-ignores]
# The fmt: off phoneme timing table holds data rows longer than the line-length limit by design.
# zip() pairs two arrays built together in lockstep, and adding strict= is a behavior change left for a later step.
"src/tts_api/morshutalk/morshu.py" = ["E501", "B905"]
